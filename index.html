<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<title>خريطة نجومنا — نورهان</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1a;--bg2:#0e1633;--gold:#e8c37a;--gold2:#f6e3b4;--ink:#f4efe6;--dim:#a9b0cc;--line:rgba(232,195,122,.28)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 70%);color:var(--ink);font:500 17px/1.7 Tajawal,Tahoma,sans-serif;overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 18px 40px;min-height:100%}
h1,h2{font-family:'Aref Ruqaa',Georgia,serif;color:var(--gold2);font-weight:700;line-height:1.35}
h1{font-size:2.6rem}h2{font-size:1.7rem}
p{color:var(--ink)}.dim{color:var(--dim);font-size:.92rem}
.hide{display:none!important}
.intro{text-align:center;padding-top:16vh}
.intro p{margin:18px 0 28px}
button{font:700 1.05rem Tajawal,sans-serif;color:#1a1305;background:linear-gradient(180deg,var(--gold2),var(--gold));border:0;border-radius:999px;padding:13px 30px;cursor:pointer;min-height:48px}
button.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,.opt:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
#map{width:100%;max-height:36vh;display:block;margin:0 auto}
.card{background:rgba(14,22,51,.72);border:1px solid var(--line);border-radius:18px;padding:22px 20px;backdrop-filter:blur(6px)}
.card h2{margin-bottom:6px}.q{margin:10px 0 16px}
.opts{display:grid;gap:10px}
.opt{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;text-align:center;cursor:pointer;min-height:48px;transition:background .2s,border-color .2s}
.opt.on{background:rgba(232,195,122,.18);border-color:var(--gold)}
.opt.bad{animation:shake .35s;border-color:#e58d8d}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.slot{min-height:52px;border-bottom:1px dashed var(--line);display:flex;gap:10px;justify-content:center;align-items:center;direction:ltr;margin-bottom:6px}
.chips.en{direction:ltr}
input[type=text],input[type=tel]{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:700 1.4rem Tajawal,sans-serif;padding:12px;text-align:center;letter-spacing:.3em;margin:6px 0 14px;direction:ltr}
.msg{min-height:1.6em;color:#f0b3b3;margin-top:10px;text-align:center}
.reveal{margin-top:18px;text-align:center}
.reveal img,.reveal video{width:100%;border-radius:14px;border:1px solid var(--line);display:block;background:#000}
.reveal p{margin:12px 0 16px;font-family:'Aref Ruqaa',serif;font-size:1.25rem;color:var(--gold2)}
.hold{position:relative;width:110px;height:110px;margin:10px auto;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:2.6rem;color:var(--gold);touch-action:none;user-select:none;-webkit-user-select:none}
.hold svg{position:absolute;inset:-2px;transform:rotate(-90deg)}
.cmp{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/5;direction:ltr;touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .top{clip-path:inset(0 50% 0 0)}
.cmp input{position:absolute;inset:auto 0 12px 0;width:80%;margin:0 auto;left:0;right:0;z-index:3;accent-color:var(--gold)}
.tag{position:absolute;top:10px;z-index:2;background:rgba(7,11,26,.7);padding:2px 10px;border-radius:99px;font-size:.8rem}
.final{text-align:center;padding-top:6vh}
.final h1{margin:14px 0}
.final .note{margin:18px 0;font-size:1.15rem}
.gift{border:1px solid var(--gold);border-radius:16px;padding:18px;margin-top:20px;background:rgba(232,195,122,.08)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <section id="intro" class="intro">
    <h1>خريطة نجومنا</h1>
    <p>في السما سبع نجوم مطفية، وكل واحدة محبوسة جواها ذكرى من حكايتنا.<br>حلّي لغز كل نجمة وهتنوّر. وفي الآخر هتتوصل كلها.</p>
    <button id="start">ابدئي</button>
  </section>
  <section id="game" class="hide">
    <svg id="map" viewBox="0 0 300 200" role="img" aria-label="خريطة النجوم"></svg>
    <div id="card" class="card"></div>
  </section>
  <section id="final" class="final hide"></section>
</main>

<script>
/* ====== عدّل هنا بس ====== */
const A = n => 'assets/' + n;
const PHOTO = {
  first:'first-bracelets.jpg', selfie:'memory-selfie.jpg', proposal:'proposal.jpg',
  film:'proposal-film.mp4', engage:'engagement.jpg', rings:'our-rings.jpg', snow:'snow-memory.jpg'
};
const FINAL_TITLE = 'كل سنة وإنتي طيبة يا نورهان';
const FINAL_TEXT = 'سبع نجوم، وسبع ذكريات، وحكاية واحدة. أنتِ أحلى حاجة حصلت فيها. كل ما بقلب في الصور بلاقيكي بتضحكي، وبفتكر إني اخترت صح من أول يوم.';
const GIFT_TEXT = 'هديتك مستنياكي. بصّي حواليكي، أنا عارف مكانها.';
/* ======================== */

const $ = s => document.querySelector(s);
const norm = s => String(s).trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
// نقاط النجوم على خريطة القلب (الثامنة = أنتِ)
const PTS = [[80,125],[62,65],[112,36],[150,72],[188,36],[238,65],[220,125],[150,175]];
let cur = 0;

const STAGES = [
 {t:'النجمة الأولى', q:'٢٣ أكتوبر. أول مرة شفتك. أنهي سنة؟', type:'choice', opts:['٢٠٢٠','٢٠٢١','٢٠٢٢','٢٠٢٣'], ok:'٢٠٢١',
  rev:{img:PHOTO.selfie, cap:'٢٣ / ١٠ / ٢٠٢١. اليوم اللي بدأت فيه كل حاجة.'}},
 {t:'النجمة التانية', q:'٦ نوفمبر. أول رسالة مكتوبة. رتّبي الكلمات التلات.', type:'order', words:['love','I','you'], ok:'I love you',
  rev:{cap:'تلات كلمات بس، وغيّروا كل حاجة.'}},
 {t:'النجمة التالتة', q:'٣٠ ديسمبر ٢٠٢١، أول خروجة في الكوربة. اختاري الهدايا التلاتة اللي إديتهالك وقتها.', type:'multi',
  opts:['كريستالة','دبدوب','عروسة سانتا','شوكولاتة','إسوارة العلاقة','وردة'], ok:['كريستالة','عروسة سانتا','إسوارة العلاقة'],
  rev:{img:PHOTO.first, cap:'أول مرة نمسك إيد بعض، وأول «بحبك» وش لوش. والإسوارتين لسه معاكي.'}},
 {t:'النجمة الرابعة', q:'٢٠ يوليو ٢٠٢٥. فاكرة اليوم ده؟ إمسكي النجمة تلات ثواني.', type:'hold',
  rev:{img:PHOTO.proposal, video:PHOTO.film, cap:'اليوم اللي سألتك فيه السؤال، وقلتي آه.'}},
 {t:'النجمة الخامسة', q:'٣٠ يوليو ٢٠٢٥، الخطوبة. حرّكي الخط وشوفي الفرق بين اليومين.', type:'slider',
  rev:{img:PHOTO.engage, cap:'وقتها كنا بنبدأ حكايتنا. النهارده بنختار الأبد.'}},
 {t:'النجمة السادسة', q:'من يوم البروپوزال لحد يوم الخطوبة، كام يوم عدّوا؟', type:'calc', ok:'10',
  rev:{img:PHOTO.snow, cap:'عشرة أيام بس، وبعدها بقينا عالم صغير لوحدنا.'}},
 {t:'النجمة الأخيرة', q:'ليها رقم واحد بس: يوم ميلادك. اكتبيه (يوم وشهر).', type:'code', ok:'3011', last:true}
];

/* ---- الخريطة ---- */
function drawMap(){
  const m = $('#map'); let h = '';
  for(let i=0;i<PTS.length-1;i++){ // خطوط بين النجوم المضاءة
    const a=PTS[i], b=PTS[i+1];
    h += `<line class="ln" id="l${i}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#e8c37a" stroke-width="1.2" opacity="0" stroke-linecap="round"/>`;
  }
  h += `<line id="lc" x1="150" y1="175" x2="80" y2="125" stroke="#e8c37a" stroke-width="1.2" opacity="0"/>`;
  PTS.forEach((p,i)=>{ h += `<g id="s${i}" opacity=".25"><circle cx="${p[0]}" cy="${p[1]}" r="9" fill="#e8c37a" opacity="0" class="halo"/><path d="M${p[0]} ${p[1]-6} l1.7 4.3 4.5.3 -3.5 2.9 1.2 4.5 -3.9 -2.5 -3.9 2.5 1.2 -4.5 -3.5 -2.9 4.5 -.3z" fill="#f6e3b4"/></g>`; });
  m.innerHTML = h; update();
}
function update(){
  PTS.forEach((_,i)=>{
    const g=$('#s'+i); if(!g) return;
    const on = i < cur; g.setAttribute('opacity', on?1:(i===cur?.7:.25));
    g.querySelector('.halo').setAttribute('opacity', on?.35:0);
    if(i===cur && cur<7) g.firstChild.setAttribute('opacity',.25);
  });
  for(let i=0;i<7;i++){ const l=$('#l'+i); if(l) l.setAttribute('opacity', i < cur-1 ? .9 : 0); }
}

/* ---- شاشات الألغاز ---- */
function render(){
  const s = STAGES[cur], c = $('#card');
  c.innerHTML = `<h2>${s.t}</h2><p class="q">${s.q}</p><div id="body"></div><div class="msg" id="msg" role="alert"></div>`;
  const b = $('#body');
  if(s.type==='choice'){
    b.innerHTML = `<div class="opts">${s.opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`;
    b.querySelectorAll('.opt').forEach(x=>x.onclick=()=>x.dataset.v===s.ok?solve():bad(x));
  }
  if(s.type==='order'){
    const pool = s.words.slice(); let got=[];
    b.innerHTML = `<div class="slot" id="slot"></div><div class="chips en" id="pool"></div>`;
    const paint=()=>{ $('#slot').innerHTML = got.map(w=>`<span class="opt on">${w}</span>`).join('');
      $('#pool').innerHTML = pool.map(w=>`<button class="opt" data-w="${w}">${w}</button>`).join('');
      $('#pool').querySelectorAll('.opt').forEach(x=>x.onclick=()=>{ got.push(x.dataset.w); pool.splice(pool.indexOf(x.dataset.w),1);
        if(!pool.length){ got.join(' ')===s.ok ? solve() : (msg('الترتيب مش مظبوط. جرّبي تاني.'), pool.push(...got), got=[]); }
        paint(); }); };
    paint();
  }
  if(s.type==='multi'){
    const pick=new Set();
    b.innerHTML = `<div class="opts">${s.opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div><p class="dim" style="margin:12px 0">اختاري ٣ بالظبط</p><button id="go">تأكيد</button>`;
    b.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{ pick.has(x.dataset.v)?pick.delete(x.dataset.v):pick.add(x.dataset.v); x.classList.toggle('on'); });
    $('#go').onclick=()=>{ const ok = pick.size===3 && s.ok.every(v=>pick.has(v)); ok?solve():msg('فيه اختيار غلط. فكّري تاني.'); };
  }
  if(s.type==='hold'){
    b.innerHTML = `<div class="hold" id="hold"><svg viewBox="0 0 114 114" width="114" height="114"><circle id="ring" cx="57" cy="57" r="54" fill="none" stroke="#e8c37a" stroke-width="3" stroke-dasharray="339" stroke-dashoffset="339"/></svg>★</div>`;
    const h=$('#hold'), r=$('#ring'); let t0=0,raf=0,done=false;
    const tick=()=>{ const p=Math.min((performance.now()-t0)/3000,1); r.style.strokeDashoffset=339*(1-p); if(p>=1&&!done){done=true;solve();} else if(!done) raf=requestAnimationFrame(tick); };
    const down=e=>{ e.preventDefault(); t0=performance.now(); raf=requestAnimationFrame(tick); };
    const up=()=>{ if(!done){ cancelAnimationFrame(raf); r.style.strokeDashoffset=339; } };
    h.addEventListener('pointerdown',down); ['pointerup','pointerleave','pointercancel'].forEach(ev=>h.addEventListener(ev,up));
  }
  if(s.type==='slider'){
    b.innerHTML = `<div class="cmp"><img src="${A(PHOTO.rings)}" alt="خواتمنا"><img class="top" id="top" src="${A(PHOTO.first)}" alt="إيدينا زمان"><span class="tag" style="left:10px">٢٠٢١</span><span class="tag" style="right:10px">٢٠٢٥</span><input type="range" id="rg" min="0" max="100" value="50" aria-label="قارني"></div><p class="dim" style="margin:10px 0">حرّكيه لحد الآخر في الاتجاهين.</p>`;
    let seenL=false,seenR=false;
    $('#rg').oninput=e=>{ const v=+e.target.value; $('#top').style.clipPath=`inset(0 ${100-v}% 0 0)`; if(v<6)seenL=true; if(v>94)seenR=true; if(seenL&&seenR) solve(); };
  }
  if(s.type==='calc'||s.type==='code'){
    b.innerHTML = `<input type="tel" id="in" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="الإجابة"><button id="go">${s.type==='code'?'افتحي النجمة':'تأكيد'}</button>`;
    const chk=()=>norm($('#in').value)===s.ok?solve():(bad($('#in')),msg('مش دي. جرّبي تاني.'));
    $('#go').onclick=chk; $('#in').onkeydown=e=>{if(e.key==='Enter')chk();};
  }
}
function msg(t){ const m=$('#msg'); if(m) m.textContent=t; }
function bad(el){ el.classList.add('bad'); setTimeout(()=>el.classList.remove('bad'),400); msg('مش دي. جرّبي تاني.'); }

function solve(){
  const s=STAGES[cur]; cur++; update();
  if(s.last){ return finale(); }
  const r=s.rev, c=$('#card');
  const media = r.video ? `<video controls playsinline preload="metadata" poster="${A(r.img)}" src="${A(r.video)}"></video>` : (r.img?`<img src="${A(r.img)}" alt="">`:'');
  c.innerHTML = `<h2>نوّرت ✨</h2><div class="reveal">${media}<p>${r.cap}</p><button id="next">النجمة اللي بعدها</button></div>`;
  $('#next').onclick=render; c.scrollIntoView({behavior:'smooth',block:'start'});
}

function finale(){
  $('#lc').setAttribute('opacity',.9); $('#l6').setAttribute('opacity',.9);
  cur=8; update();
  $('#game').classList.add('hide'); const f=$('#final'); f.classList.remove('hide');
  f.innerHTML = `<svg viewBox="0 0 300 200" style="width:100%;max-height:34vh">${$('#map').innerHTML.replace(/opacity="0"/g,'opacity=".9"')}</svg>
  <h1>${FINAL_TITLE}</h1><p class="note">${FINAL_TEXT}</p>
  <div class="gift"><h2>آخر نجمة</h2><p>${GIFT_TEXT}</p></div>`;
  f.querySelectorAll('g').forEach(g=>g.setAttribute('opacity',1));
  f.querySelectorAll('.halo').forEach(h=>h.setAttribute('opacity',.4));
  window.scrollTo({top:0,behavior:'smooth'});
}

$('#start').onclick=()=>{ $('#intro').classList.add('hide'); $('#game').classList.remove('hide'); drawMap(); render(); };

/* ---- السما ---- */
(function(){
  const cv=$('#sky'), x=cv.getContext('2d'); let st=[];
  const size=()=>{ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; st=Array.from({length:110},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,p:Math.random()*6})); };
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const draw=t=>{ x.clearRect(0,0,cv.width,cv.height);
    st.forEach(s=>{ x.globalAlpha=.35+.4*Math.sin(t/1400+s.p); x.fillStyle='#f6e3b4'; x.beginPath(); x.arc(s.x*cv.width,s.y*cv.height,s.r*devicePixelRatio,0,7); x.fill(); });
    if(!reduce) requestAnimationFrame(draw); };
  addEventListener('resize',size); size(); requestAnimationFrame(draw);
})();
</script>
</body>
</html>
